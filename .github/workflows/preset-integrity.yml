name: Preset integrity
on:
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - '.env.example'
      - 'presets/**'
      - 'docs/**'
      - 'README.md'
      - 'PATCH_STATUS.md'
      - 'compose/**'
      - 'docker-compose.yml'
      - 'dockerfiles/**'
      - 'patches/**'
      - 'entrypoints/**'
      - 'benchmarks/evidence/**'
      - 'benchmarks/README.md'
      - 'benchmarks/llama-benchy/README.md'
      - 'scripts/prewarm*.py'
      - 'scripts/diag/test_documentation_policy.py'
      - 'scripts/diag/documentation_policy_pins.json'
      - 'scripts/diag/verify_preset_catalog.py'
      - 'scripts/diag/test_verify_preset_catalog.py'
      - 'scripts/diag/verify_recipe_evidence.py'
      - 'scripts/diag/test_verify_recipe_evidence.py'
      - 'scripts/diag/test_solar_incremental_provenance.py'
      - 'scripts/diag/*qwen38*'
      - '.github/workflows/preset-integrity.yml'
  push:
    branches: [main]
    paths:
      - '*.md'
      - '**/*.md'
      - '.env.example'
      - 'presets/**'
      - 'docs/**'
      - 'README.md'
      - 'PATCH_STATUS.md'
      - 'compose/**'
      - 'docker-compose.yml'
      - 'dockerfiles/**'
      - 'patches/**'
      - 'entrypoints/**'
      - 'benchmarks/evidence/**'
      - 'benchmarks/README.md'
      - 'benchmarks/llama-benchy/README.md'
      - 'scripts/prewarm*.py'
      - 'scripts/diag/test_documentation_policy.py'
      - 'scripts/diag/documentation_policy_pins.json'
      - 'scripts/diag/verify_preset_catalog.py'
      - 'scripts/diag/test_verify_preset_catalog.py'
      - 'scripts/diag/verify_recipe_evidence.py'
      - 'scripts/diag/test_verify_recipe_evidence.py'
      - 'scripts/diag/test_solar_incremental_provenance.py'
      - 'scripts/diag/*qwen38*'
      - '.github/workflows/preset-integrity.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - name: Focused tests and mutations
        run: >-
          python -m pytest -q scripts/diag/test_verify_preset_catalog.py
          scripts/diag/test_verify_recipe_evidence.py
          scripts/diag/test_solar_incremental_provenance.py
          scripts/diag/test_documentation_policy.py
          scripts/diag/test_verify_qwen38_flash_next_recipe.py
          scripts/diag/test_verify_qwen38_pr55122_mtp1_c1_candidate_recipe.py
          scripts/diag/test_verify_qwen38_ngc2609_mtp_k2_c2_recipe.py
          scripts/diag/test_qwen38_ray_recipe.py
      - name: Static integrity and Compose rendering (no GPU/build/deploy)
        env:
          QWEN38_PR55122_REQUIRE_LOCAL_IMAGE_ID: '0'
        run: |
          python scripts/diag/verify_preset_catalog.py
          python scripts/diag/verify_recipe_evidence.py
          python scripts/diag/verify_qwen38_flash_next_recipe.py
          python scripts/diag/verify_qwen38_pr55122_mtp1_c1_candidate_recipe.py
          python scripts/diag/verify_qwen38_ngc2609_mtp_k2_c2_recipe.py
