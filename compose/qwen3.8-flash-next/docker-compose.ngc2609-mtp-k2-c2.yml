# Exact opt-in overlay for the qualified NGC 26.09/e77 Qwen3.8 MTP k=2/C2 profile.
# Use with docker-compose.yml and the matching preset. It does not add restart/autostart policy.
services:
  head:
    # Replace the generic base environment instead of merging it. Ray 2.59 and
    # FlashInfer treat some present-but-empty variables as active malformed
    # settings; the qualified direct-run closure intentionally omitted them.
    environment: !override
      - ROLE=head
      - VLLM_HOST_IP=${HEAD_ROCE_IP}
      - MODEL_CONTAINER_PATH=${MODEL_CONTAINER_PATH}
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME}
      - HOST_PORT=${HOST_PORT}
      - TP_SIZE=${TP_SIZE}
      - NNODES=2
      - HEAD_ROCE_IP=${HEAD_ROCE_IP}
      - WORKER_ROCE_IP=${WORKER_ROCE_IP}
      - RAY_PORT=${RAY_PORT}
      - RAY_OBJECT_STORE_MEMORY_BYTES=${RAY_OBJECT_STORE_MEMORY_BYTES}
      - RAY_memory_monitor_refresh_ms=${RAY_memory_monitor_refresh_ms}
      - VLLM_USE_RAY_V2_EXECUTOR_BACKEND=${VLLM_USE_RAY_V2_EXECUTOR_BACKEND}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION}
      - NCCL_DEBUG=${NCCL_DEBUG}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE}
      - NCCL_IB_HCA=${IB_HCA_NAME}
      - NCCL_SOCKET_IFNAME=${ROCE_IF_NAME}
      - GLOO_SOCKET_IFNAME=${ROCE_IF_NAME}
      - NCCL_NVLS_ENABLE=${NCCL_NVLS_ENABLE}
      - TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=${TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC}
      - VLLM_MOE_USE_DEEP_GEMM=${VLLM_MOE_USE_DEEP_GEMM}
      - VLLM_USE_DEEP_GEMM_E8M0=${VLLM_USE_DEEP_GEMM_E8M0}
      - KV_CACHE_MEMORY_BYTES=${KV_CACHE_MEMORY_BYTES:-8589934592}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-auto}
      - MODEL_REVISION=${MODEL_REVISION}
      - RAY_JOIN_TIMEOUT_SEC=${RAY_JOIN_TIMEOUT_SEC:-600}
      - RAY_INCLUDE_DASHBOARD=${RAY_INCLUDE_DASHBOARD:-false}
      - VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE=${VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE:-auto}
      - VLLM_ALL2ALL_BACKEND=${VLLM_ALL2ALL_BACKEND:-allgather_reducescatter}
      - UCX_NET_DEVICES=${ROCE_IF_NAME}
      - HF_HOME=/cache/huggingface
      - XDG_CACHE_HOME=/cache/xdg
      - VLLM_CACHE_ROOT=/cache/vllm
      - TRITON_CACHE_DIR=/cache/triton
      - TORCHINDUCTOR_CACHE_DIR=/cache/torchinductor
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/utils.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/utils.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/parameter.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/parameter.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/linear.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/linear.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/vocab_parallel_embedding.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/vocab_parallel_embedding.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/fused_moe/routed_experts.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/routed_experts.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/model_loader/weight_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/weight_utils.py:ro
      - ./cache/qwen38-ngc2609-e77:/cache:rw
    cap_add: [SYS_PTRACE, IPC_LOCK]
    security_opt: [label=disable]
    oom_score_adj: 1000
    shm_size: 32gb
    ulimits:
      stack: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 160
      start_period: 3600s

  worker:
    environment: !override
      - ROLE=worker
      - VLLM_HOST_IP=${WORKER_ROCE_IP}
      - MODEL_CONTAINER_PATH=${MODEL_CONTAINER_PATH}
      - SERVED_MODEL_NAME=${SERVED_MODEL_NAME}
      - HOST_PORT=${HOST_PORT}
      - TP_SIZE=${TP_SIZE}
      - NNODES=2
      - HEAD_ROCE_IP=${HEAD_ROCE_IP}
      - WORKER_ROCE_IP=${WORKER_ROCE_IP}
      - RAY_PORT=${RAY_PORT}
      - RAY_OBJECT_STORE_MEMORY_BYTES=${RAY_OBJECT_STORE_MEMORY_BYTES}
      - RAY_memory_monitor_refresh_ms=${RAY_memory_monitor_refresh_ms}
      - VLLM_USE_RAY_V2_EXECUTOR_BACKEND=${VLLM_USE_RAY_V2_EXECUTOR_BACKEND}
      - MAX_MODEL_LEN=${MAX_MODEL_LEN}
      - MAX_NUM_SEQS=${MAX_NUM_SEQS}
      - MAX_NUM_BATCHED_TOKENS=${MAX_NUM_BATCHED_TOKENS}
      - GPU_MEMORY_UTILIZATION=${GPU_MEMORY_UTILIZATION}
      - NCCL_DEBUG=${NCCL_DEBUG}
      - NCCL_IB_DISABLE=${NCCL_IB_DISABLE}
      - NCCL_IB_HCA=${IB_HCA_NAME}
      - NCCL_SOCKET_IFNAME=${ROCE_IF_NAME}
      - GLOO_SOCKET_IFNAME=${ROCE_IF_NAME}
      - NCCL_NVLS_ENABLE=${NCCL_NVLS_ENABLE}
      - TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC=${TORCH_NCCL_HEARTBEAT_TIMEOUT_SEC}
      - VLLM_MOE_USE_DEEP_GEMM=${VLLM_MOE_USE_DEEP_GEMM}
      - VLLM_USE_DEEP_GEMM_E8M0=${VLLM_USE_DEEP_GEMM_E8M0}
      - KV_CACHE_MEMORY_BYTES=${KV_CACHE_MEMORY_BYTES:-8589934592}
      - KV_CACHE_DTYPE=${KV_CACHE_DTYPE:-auto}
      - MODEL_REVISION=${MODEL_REVISION}
      - RAY_JOIN_TIMEOUT_SEC=${RAY_JOIN_TIMEOUT_SEC:-600}
      - RAY_INCLUDE_DASHBOARD=${RAY_INCLUDE_DASHBOARD:-false}
      - VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE=${VLLM_USE_RAY_COMPILED_DAG_CHANNEL_TYPE:-auto}
      - VLLM_ALL2ALL_BACKEND=${VLLM_ALL2ALL_BACKEND:-allgather_reducescatter}
      - UCX_NET_DEVICES=${ROCE_IF_NAME}
      - HF_HOME=/cache/huggingface
      - XDG_CACHE_HOME=/cache/xdg
      - VLLM_CACHE_ROOT=/cache/vllm
      - TRITON_CACHE_DIR=/cache/triton
      - TORCHINDUCTOR_CACHE_DIR=/cache/torchinductor
      - TOKENIZERS_PARALLELISM=false
    volumes:
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/utils.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/utils.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/parameter.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/parameter.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/linear.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/linear.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/vocab_parallel_embedding.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/vocab_parallel_embedding.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/layers/fused_moe/routed_experts.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/fused_moe/routed_experts.py:ro
      - ${QWEN38_NGC2609_OVERLAY_ROOT:-./patches/qwen/ngc2609-e77-prefault}/model_executor/model_loader/weight_utils.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/model_loader/weight_utils.py:ro
      - ./cache/qwen38-ngc2609-e77:/cache:rw
    cap_add: [SYS_PTRACE, IPC_LOCK]
    security_opt: [label=disable]
    oom_score_adj: 1000
    shm_size: 32gb
    ulimits:
      stack: 67108864
