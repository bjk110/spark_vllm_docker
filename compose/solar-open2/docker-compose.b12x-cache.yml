# compose/solar-open2/docker-compose.b12x-cache.yml
#
# Cache/JIT overlay for the Solar-Open2-250B r4 BF16 production route.
# Originated as the b12x cold/warm cache diagnostic overlay (2026-07-26);
# validated in Gate 5 of the 2026-08-08/09 production fast-track as a
# JIT-cache warm-start optimization only, not a correctness dependency —
# a cold-cache launch through the Compose files alone still starts and
# serves correctly, it just pays the same JIT-compilation warmup cost
# documented for the v0.22.1 rollback baseline (see
# docs/solar-open2-production.md section 5). Kept as a separate overlay from
# docker-compose.r4-production.yml because it is host/cache/JIT-related and
# conceptually separable from correctness/runtime-required configuration.
#
# Bind-mounts experiment-owned per-node cache directories over every
# persistent JIT/compile cache location used by the r3/r4 runtime, plus the
# /obs telemetry sink. B12X_CACHE_DIR must be exported by the launcher and
# is NODE-LOCAL (never shared between spark01 and spark02).
#
# Cache contract (discovered from the r3 image, see cache-discovery/):
#   dotcache -> /root/.cache   FlashInfer JIT workspace+log
#                              (/root/.cache/flashinfer/0.6.15/121a: generated
#                              sources + cached_ops .so), VLLM_CACHE_ROOT
#                              (~/.cache/vllm), any ~/.cache consumer.
#                              In-image content shadowed: 8 KiB stale jit log
#                              + pip/uv caches only (no prebaked kernels).
#   triton   -> /root/.triton  Triton default cache (TRITON_CACHE_DIR unset).
#   nv       -> /root/.nv      CUDA driver JIT ComputeCache (CUDA_CACHE_PATH unset).
#   cutedsl  -> /cache/cutedsl CUTLASS CuTe DSL cache, redirected from its
#                              non-persistent /tmp default via CUTE_DSL_CACHE_DIR
#                              (identical in both arms).
# Not applicable (documented, nothing mounted): torchinductor (compilation
# mode NONE), deep_gemm (module not installed in this image), /tmp (holds
# Ray session runtime state; must NOT persist across arms).
#
# B12X_CACHE_DIR resolution is launcher-local-only (not tracked in this
# repository) — see docs/solar-open2-production.md section 5 for the
# reproducibility-limitation note.
services:
  head:
    environment:
      - CUTE_DSL_CACHE_DIR=/cache/cutedsl
    volumes:
      - ${B12X_CACHE_DIR:?}/dotcache:/root/.cache
      - ${B12X_CACHE_DIR:?}/triton:/root/.triton
      - ${B12X_CACHE_DIR:?}/nv:/root/.nv
      - ${B12X_CACHE_DIR:?}/cutedsl:/cache/cutedsl
      - /home/bjk110/docker-build/c2-obs:/obs
  worker:
    environment:
      - CUTE_DSL_CACHE_DIR=/cache/cutedsl
    volumes:
      - ${B12X_CACHE_DIR:?}/dotcache:/root/.cache
      - ${B12X_CACHE_DIR:?}/triton:/root/.triton
      - ${B12X_CACHE_DIR:?}/nv:/root/.nv
      - ${B12X_CACHE_DIR:?}/cutedsl:/cache/cutedsl
      - /home/bjk110/docker-build/c2-obs:/obs
