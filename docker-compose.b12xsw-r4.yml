# Disposable overlay: forward VLLM_SPARK_B12X_SHARED_WORKSPACE into the
# head/worker containers (base compose enumerates env vars; untouched).
# Empty/unset means default OFF. EXPERIMENTAL — r4 lineage only.
services:
  head:
    environment:
      - VLLM_SPARK_B12X_SHARED_WORKSPACE=${VLLM_SPARK_B12X_SHARED_WORKSPACE:-}
  worker:
    environment:
      - VLLM_SPARK_B12X_SHARED_WORKSPACE=${VLLM_SPARK_B12X_SHARED_WORKSPACE:-}
