# Disposable override for the Solar-Open2 NVFP4 dual-node smoke test (attempt 2,
# 2026-07-24). Raises Ray GCS node health-check tolerance so a transient host
# stall during the 143 GiB weight load does not mark a node dead (attempt 1
# failure mode: spark02 raylet missed heartbeats -> ActorDiedError).
# Tolerance: 60 s initial delay, then 10 consecutive failed probes at 30 s
# period (120 s timeout each) before a node is declared dead (~5-6 min stall).
# Do not use for production presets.
services:
  head:
    environment:
      - RAY_health_check_initial_delay_ms=60000
      - RAY_health_check_period_ms=30000
      - RAY_health_check_timeout_ms=120000
      - RAY_health_check_failure_threshold=10
  worker:
    environment:
      - RAY_health_check_initial_delay_ms=60000
      - RAY_health_check_period_ms=30000
      - RAY_health_check_timeout_ms=120000
      - RAY_health_check_failure_threshold=10
